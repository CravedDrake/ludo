<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080D18" />
  <title>Ludo — Play with friends</title>
  <meta name="description" content="Create a room, share the code and play Ludo with friends in real time. No sign-up needed." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231B263B'/%3E%3Ccircle cx='10' cy='10' r='3.4' fill='%23FF5263'/%3E%3Ccircle cx='22' cy='10' r='3.4' fill='%233B82F6'/%3E%3Ccircle cx='10' cy='22' r='3.4' fill='%2322C55E'/%3E%3Ccircle cx='22' cy='22' r='3.4' fill='%23FBBF24'/%3E%3C/svg%3E" />

  <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="home">

  <div class="home__glow" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Ludo home">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name">Ludo</span>
    </a>
  </header>

  <main class="home__main">

    <!-- ───────── Left: pitch + create/join ───────── -->
    <div class="home__lead">

      <div class="pitch">
        <h1 class="pitch__title">Roll, race, and send your friends home.</h1>
        <p class="pitch__text">Create a room, share the code, and play Ludo together on any device. No sign-up needed.</p>
      </div>

      <section class="panel" aria-label="Start playing">

        <div class="tabs" role="tablist" aria-label="Create or join a room">
          <button class="tabs__tab" id="tab-create" role="tab" type="button" aria-selected="true" aria-controls="pane-create">Create room</button>
          <button class="tabs__tab" id="tab-join" role="tab" type="button" aria-selected="false" aria-controls="pane-join" tabindex="-1">Join room</button>
        </div>

        <!-- ───── Create ───── -->
        <div class="pane" id="pane-create" role="tabpanel" aria-labelledby="tab-create">

          <div class="field">
            <label class="field__label" for="player-name">Your name</label>
            <input
              id="player-name"
              class="field__input"
              type="text"
              placeholder="Name or nickname"
              maxlength="20"
              autocomplete="off"
              spellcheck="false"
            />
            <span class="field__error" id="name-error" role="alert"></span>
          </div>

          <div class="field">
            <span class="field__label" id="count-label">Players</span>

            <div class="count-group" role="group" aria-labelledby="count-label">

              <!-- 2 players play Red vs Yellow (opposite corners) -->
              <button class="count-btn" data-count="2" aria-pressed="false" type="button">
                <span class="count-btn__pips" aria-hidden="true">
                  <span class="pip pip--red"></span>
                  <span class="pip pip--yellow"></span>
                </span>
                <span class="count-btn__number">2</span>
                <span class="count-btn__label">players</span>
              </button>

              <button class="count-btn" data-count="3" aria-pressed="false" type="button">
                <span class="count-btn__pips" aria-hidden="true">
                  <span class="pip pip--red"></span>
                  <span class="pip pip--blue"></span>
                  <span class="pip pip--green"></span>
                </span>
                <span class="count-btn__number">3</span>
                <span class="count-btn__label">players</span>
              </button>

              <button class="count-btn" data-count="4" aria-pressed="false" type="button">
                <span class="count-btn__pips" aria-hidden="true">
                  <span class="pip pip--red"></span>
                  <span class="pip pip--blue"></span>
                  <span class="pip pip--green"></span>
                  <span class="pip pip--yellow"></span>
                </span>
                <span class="count-btn__number">4</span>
                <span class="count-btn__label">players</span>
              </button>

            </div>

            <span class="field__error" id="count-error" role="alert"></span>
          </div>

          <button class="btn btn--primary btn--block btn--lg" id="create-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span class="btn__label">Create room</span>
          </button>

        </div>

        <!-- ───── Join ───── -->
        <div class="pane" id="pane-join" role="tabpanel" aria-labelledby="tab-join" hidden>

          <div class="field">
            <label class="field__label" for="join-code">Room code</label>
            <div class="code-input">
              <input
                id="join-code"
                class="field__input code-input__field"
                type="text"
                placeholder="AB12CD"
                maxlength="6"
                autocomplete="off"
                spellcheck="false"
                autocapitalize="characters"
                inputmode="text"
                aria-describedby="join-error"
              />
              <button class="btn btn--secondary code-input__paste" id="paste-btn" type="button" aria-label="Paste room code or invite link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3" width="8" height="4" rx="1.5"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>
                Paste
              </button>
            </div>
            <span class="field__error" id="join-error" role="alert"></span>
            <p class="field__hint">Ask the host for the 6-character code, or paste their invite link. You'll choose your name in the lobby.</p>
          </div>

          <button class="btn btn--primary btn--block btn--lg" id="join-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
            <span class="btn__label">Join room</span>
          </button>

        </div>

        <!-- ───── Room created ───── -->
        <section class="created" id="room-panel" aria-live="polite" aria-label="Room created" hidden>
          <p class="created__title">Room ready</p>
          <div class="room-code" id="room-code-display" aria-label="Room code"></div>

          <div class="link-row">
            <input class="link-row__input" id="room-link-input" type="text" readonly aria-label="Shareable invite link" />
            <button class="btn btn--secondary btn--sm" id="copy-btn" type="button">Copy link</button>
          </div>

          <p class="created__hint" id="copy-hint"></p>
          <p class="created__opening"><span class="spinner" aria-hidden="true"></span> Opening your lobby</p>
        </section>

      </section>

    </div>
